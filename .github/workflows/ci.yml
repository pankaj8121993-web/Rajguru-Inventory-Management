name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/rajguru_test
  DEV_ACTOR_CODE: EMP001

jobs:
  # ---------------------------------------------------------------------------
  # Governance — the documentation and skill structure the project depends on.
  # ---------------------------------------------------------------------------
  governance:
    name: Governance structure
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Verify required documents and skills exist
        run: ./scripts/check-structure.sh

      - name: Verify skill mirrors are current
        run: ./scripts/sync-skills.sh --check

      - name: Guard the inventory invariants
        run: |
          # Protects rules that must never be weakened by an edit.
          # See docs/01-domain/INVENTORY_INVARIANTS.md
          fail=0

          if ! grep -q "INV-04" docs/01-domain/INVENTORY_INVARIANTS.md; then
            echo "::error::INV-04 (lot_id stays nullable) is missing from the invariants file"
            fail=1
          fi

          count=$(grep -cE '^\| INV-[0-9]+ \|' docs/01-domain/INVENTORY_INVARIANTS.md || true)
          if [ "$count" -lt 25 ]; then
            echo "::error::Expected at least 25 invariants, found $count. Invariants may be added, never removed."
            fail=1
          fi
          echo "Found $count invariants."

          exit $fail

  # ---------------------------------------------------------------------------
  # Secret scanning.
  # ---------------------------------------------------------------------------
  secrets:
    name: Secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # ---------------------------------------------------------------------------
  # Static checks and unit tests. No database needed.
  # ---------------------------------------------------------------------------
  static:
    name: Lint, types and unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm

      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run test

      - name: Production build
        run: npm run build

      # INV-25 / NFR-04: the service-role key must never reach the browser.
      - name: Scan client bundle for the service-role key
        run: |
          if grep -rEl "SUPABASE_SERVICE_ROLE|service_role" .next/static 2>/dev/null; then
            echo "::error::Service-role key reference found in the client bundle (INV-25)."
            exit 1
          fi
          echo "Client bundle clean."

  # ---------------------------------------------------------------------------
  # Database and browser tests, against a real PostgreSQL instance.
  # ---------------------------------------------------------------------------
  database:
    name: Database, RLS and end-to-end tests
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: rajguru_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm

      - name: Install PostgreSQL client
        run: sudo apt-get update && sudo apt-get install -y postgresql-client

      - run: npm ci

      # Proves migrations build the schema from nothing — not just from the
      # state that happens to be on a developer's machine.
      - name: Apply migrations from scratch
        run: ./scripts/db-migrate.sh

      - name: Seed
        run: psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f supabase/seed.sql

      - name: Database, RLS and constraint tests
        run: npm run test:db

      - name: Build
        run: npm run build

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      - name: End-to-end tests
        run: npx playwright test e2e/master-data.spec.ts

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7
